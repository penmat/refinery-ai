[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refinery-ai"
version = "0.1.0"
description = "A safe, auditable modernization factory for Java applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "certifi>=2025.1.31",
  "litellm>=1.80,<2",
  "mcp>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "pydantic>=2.10,<3",
  "pydantic-ai-harness==0.21.0",
  "pydantic-ai-slim[openai]==2.33.0",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
]

[project.scripts]
refinery = "refinery_ai.cli:app"

[dependency-groups]
dev = [
  "hatchling>=1.32.0",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/refinery_ai"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=refinery_ai --cov-report=term-missing"
testpaths = ["tests"]
markers = ["sonarqube: runs a real temporary SonarQube Docker integration"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["refinery_ai"]
