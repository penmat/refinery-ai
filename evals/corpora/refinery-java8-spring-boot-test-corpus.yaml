schema_version: 1
corpus:
  id: refinery-java8-spring-boot
  name: Refinery Java 8 Spring Boot migration corpus
  description: A regression corpus of moderately sized Spring Boot repositories believed to target Java 8, assembled for testing
    conservative Java 17 migrations.
  source_context: Find Older Java Projects
  generated_on: 2026-08-31
  caveats:
  - Repository metadata and default branches can change; verify the Java target after cloning.
  - Pin a commit after validation to make benchmark runs reproducible.
  - Some projects need external services, so compile and test expectations may require per-project setup.
  defaults:
    source_java: '8'
    build_system: maven
    framework: spring-boot
    migration_goal:
      target_java: '17'
      intent: compatibility
      change_appetite: minimal
      preserve_architecture: true
      upgrade_dependencies: only_when_required
      success_criteria:
      - project compiles on Java 17
      - existing tests pass
      - no unrelated refactoring
      - application behavior is preserved
